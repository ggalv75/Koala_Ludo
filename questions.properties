# Question 30: Requirements Review: ATM
question.30.level=HARD
question.30.topic=Requirements Review: ATM
question.30.text=בתרגול 3 מופיע סיפור לקוח על מערכת כספומטים. לפי הסיפור:\n- משיכות מתבצעות בכפולות של 200 ש״ח.\n- לקוח של בנק זר רשאי למשוך סכום הקטן מ־500 ש״ח.\nלעומת זאת, במפרט הדרישות נכתב שכרטיס של בנק זר מוגבל ל־500 ש״ח, ושלקוח של בנק זר יקבל את הסכום שביקש.\n\nמנתח המערכת טוען כי אפשר לאשר ללקוח של בנק זר משיכה של 500 ש״ח.\n\nאיזו מסקנה נכונה?
question.30.option.0=הטענה אינה תואמת את סיפור הלקוח: 500 ש״ח אינם קטנים מ־500, וגם אינם כפולה של 200. יש לתקן את הסתירה והעמימות במפרט.
question.30.option.1=הטענה נכונה משום שכל סכום עד 500 ש״ח, כולל 500, מותר לבנק זר.
question.30.option.2=הטענה נכונה משום שהדרישה האחרונה במפרט תמיד גוברת על סיפור הלקוח.
question.30.option.3=אין בעיה בדרישות, משום שמגבלות הסכום רלוונטיות רק ללקוחות הבנק המקומי.
