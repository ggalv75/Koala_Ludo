question.22.text=בהרצאה 6 מופיעה פונקציה לבדיקת תקינות סיסמה. בתחילת המימוש מופיע הקוד הבא:\npublic static boolean isValid(String pw) {\nif (pw.equals("testing")) {\nreturn true;\n}\n\nif (pw.length() < 8) {\nreturn false;\n}\n\nif (pw.length() > 16) {\nreturn false;\n}\n\n// בדיקות נוספות לרווחים ולספרות\n// ...\n}\n\nלפי דרישות המערכת, סיסמה חייבת להכיל 8–16 תווים, לפחות ספרה אחת וללא רווחים.\n\nאיזו טענה נכונה?
question.22.option.0=הקוד מכיל מסלול מיוחד שמאשר סיסמה לא חוקית; בדיקת testing תחשוף את השגיאה.
question.22.option.1=הקוד תקין, משום שכל סיסמה שמכילה אותיות באנגלית מותרת.
question.22.option.2=הקוד ידחה את testing משום שאורכה שבעה תווים.
question.22.option.3=מכיוון ששש בדיקות ה־Black Box המקוריות עברו בהצלחה, אפשר להסיק שהמימוש נכון בכל מקרה.
question.22.answer=HW9gq/MPvZwYl4DfcfsWv3OUXcgWbciqbXVJVp4=

# Question 23: Statement Coverage vs. Path Coverage
question.23.level=HARD
question.23.topic=Statement Coverage vs. Path Coverage
question.23.text=בדוגמת חישוב מחיר הנסיעה במונית בהרצאה 6 מוצגים:\n- 24 מסלולים אפשריים בגרף.\n- שלושה מסלולי בדיקה המספיקים לכיסוי פקודות (Statement Coverage) בדוגמה.\nמהי המסקנה הנכונה?
question.23.option.0=אם שלוש בדיקות מספיקות ל־Statement Coverage, הן בהכרח מכסות גם את כל 24 המסלולים.
question.23.option.1=Cyclomatic Complexity תמיד שווה למספר כל המסלולים האפשריים בגרף.
question.23.option.2=אפשר להגיע לכיסוי כל הפקודות באמצעות מספר בדיקות קטן ממספר המסלולים האפשריים, משום שבדיקות שונות יכולות לכסות יחד את כל הפקודות בלי לעבור בכל המסלולים.
question.23.option.3=אם יש 24 מסלולים, חייבים להריץ לפחות 24 בדיקות כדי להגיע לכל סוג של כיסוי.
question.23.answer=S8F+lakU/StehTOIantyRlesihJcnVCMn8aqmaA=

# Question 24: Correctness of Specifications
question.24.level=HARD
question.24.topic=Correctness of Specifications
question.24.text=בהרצאה 6 מוצגת דוגמה למפרט מיון לא תקין.\n\nהמפרט דורש שהמערך המוחזר יהיה ממוין בסדר עולה, אך אינו דורש לשמור את האיברים המקוריים.\n\nנתונה הפונקציה:\nvoid trickSort(int[] p, int[] q) {\nint n = p.length;\n\nfor (int i = 0; i < n; i++) {\nq[i] = 0;\n}\n}\n\nאיזו טענה נכונה?
question.24.option.0=הפונקציה אינה עומדת במפרט משום שכל מיון מחייב שימוש באלגוריתם השוואה.
question.24.option.1=הפונקציה עומדת במפרט רק אם המערך המקורי מכיל אפסים בלבד.
question.24.option.2=הפונקציה אינה עומדת במפרט משום שמערך של אפסים אינו ממוין.
question.24.option.3=הפונקציה עשויה לעמוד במפרט החסר, אך אינה מבצעת מיון אמיתי; המפרט צריך לדרוש שהפלט יהיה תמורה (Permutation) של איברי הקלט.
question.24.answer=FkROL6PcH1KZmWGL0mc9oUoFi9ycTlctb3iAogQ=

# Question 25: Inspection vs. Walkthrough
question.25.level=HARD
question.25.topic=Inspection vs. Walkthrough
question.25.text=צוות מבצע סקירת תכנון פורמלית.\n\nמנהל הצוות רוצה להבחין בין Inspection לבין Walkthrough לפי התפקידים המוצגים בהרצאה 3.\n\nאיזו חלוקת תפקידים תואמת את ההבחנה בהרצאה?
question.25.option.0=ב־Inspection אין צורך במנחה, בעוד שב־Walkthrough חייב להיות Moderator מוסמך.
question.25.option.1=ב־Inspection המציג הוא בדרך כלל חבר צוות שאינו המחבר, ואילו ב־Walkthrough המציג הוא בדרך כלל המחבר.
question.25.option.2=ב־Walkthrough אסור להשתתף ללקוחות או למומחי תחזוקה.
question.25.option.3=ב־Inspection לא מתעדים ממצאים, ואילו ב־Walkthrough חובה להפיק דוח מפורט של המנחה.
question.25.answer=oep0yNDfvjQbe34+OUlHpwqpnC5vafEl27auh04=

# Question 26: Black Box vs. White Box
question.26.level=HARD
question.26.topic=Black Box vs. White Box
question.26.text=בהרצאה 6 מופיעה הטבלה הבאה, המבוססת על בדיקות הסיסמה:\nTest Case\tסיסמה\tתוצאה צפויה\nTC1\tabcdef12\tAccepted\nTC2\tabcdefghijklmn12\tAccepted\nTC3\tabc1234\tRejected\nTC4\tabcdefghijklmno12\tRejected\nTC5\tabcdefghij\tRejected\nTC6\tabcd 1234\tRejected\n\nנמצא ש־TC5 אינו מוסיף כיסוי פקודות או ענפים חדשים ביחס לבדיקות האחרות.\n\nמדוע בכל זאת חשוב להשאיר אותו במערך הבדיקות?
question.26.option.0=משום שהוא בודק את הגבול העליון של אורך הסיסמה.
question.26.option.1=משום שהוא הבדיקה היחידה המבודדת את הדרישה לקיום ספרה, והוא עשוי לגלות מימוש שגוי של כלל זה גם ללא הגדלת הכיסוי המבני.
question.26.option.2=משום שבלעדיו לא ניתן להגיע לפקודת return כלשהי.
question.26.option.3=משום שכל בדיקת Black Box חייבת לכסות מסלול חדש בקוד.
