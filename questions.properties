# Question 17: UI Design: Consistency
question.17.level=MEDIUM
question.17.topic=UI Design: Consistency
question.17.text=התבונני בתרשים מתוך הרצאה 5, שקופית 73.\n\nבמערכת חדשה יש להציג מקלדת מספרים להזנת מספר טלפון. המשתמשים רגילים להשתמש במקלדת של טלפון.\n\nמהו עקרון העיצוב הרלוונטי ביותר לבחירת פריסת המקשים?
question.17.option.0=Information Hiding – להסתיר מהמשתמשים את מבנה המקלדת.
question.17.option.1=External Consistency – להשתמש בפריסה התואמת לדפוס המוכר למשתמשים ממקלדות טלפון.
question.17.option.2=Low Cohesion – לפצל את המספרים לכמה מסכים.
question.17.option.3=Architectural Recovery – לשחזר את מימוש המקלדת מתוך קוד קיים.
