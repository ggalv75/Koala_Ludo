# Question 27: Architectural Drift vs. Erosion
question.27.level=HARD
question.27.topic=Architectural Drift vs. Erosion
question.27.text=למערכת יש ארכיטקטורה מתוכננת (Prescriptive Architecture), שמחייבת שכל גישה למסד הנתונים תעבור דרך שכבת שירותים.\n\nבמהלך הפיתוח מתכנת מוסיף גישה ישירה ממסך המשתמש למסד הנתונים, בניגוד להחלטה הארכיטקטונית.\n\nכיצד יוגדר השינוי?
question.27.option.0=Architectural Recovery, משום שמבנה המערכת התגלה מתוך הקוד.
question.27.option.1=Architectural Drift, משום שכל שינוי בארכיטקטורה נקרא Drift.
question.27.option.2=Architectural Erosion, משום שהמימוש מפר החלטת תכנון של הארכיטקטורה המתוכננת.
question.27.option.3=שינוי שאינו משפיע על הארכיטקטורה, משום שמסד הנתונים עדיין פועל.
question.27.answer=39zPsA5PgpNYQyS/hWTVSHbFLI6i6nmP/uIEeGs=

